name: Publish to PyPI

# Publishing a GitHub release uploads that version to PyPI. Pushing a tag on
# its own does nothing. Running the workflow by hand builds and tests
# without publishing -- a dry run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Release tag matches package version
        if: github.event_name == 'release'
        run: |
          wheel="dist/reverie_memory-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the built version:"
            ls dist
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Test the wheel that will be uploaded, not the checkout: with the source
      # tree gone, `import reverie` can only resolve to the installed wheel.
      - run: rm -rf reverie
      - run: python -m pip install dist/*.whl pytest numpy scipy
      - run: python -m pytest -q

  publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reverie-memory
    permissions:
      id-token: write  # trusted publishing: PyPI verifies this workflow, no token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
