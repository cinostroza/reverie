[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# "reverie" on PyPI is held by an unrelated, empty project, so the distribution
# name differs. The import name and the CLI are still `reverie`.
name = "reverie-memory"
dynamic = ["version"]
description = "Precise precedent retrieval for AI agents, with a human in the loop."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Reverie contributors" }]
keywords = ["agent", "memory", "llm", "knowledge-graph", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

# The core is deliberately dependency-free: stdlib sqlite3 only.
# See HLD 4.7 -- "one file, no daemon, for the default case".
dependencies = []

[project.optional-dependencies]
# Everything needed to reproduce the published experiments.
experiments = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "networkx>=3.0",
  "jupyter>=1.0",
  "ipykernel>=6.0",
]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[project.scripts]
reverie = "reverie.cli:main"

[project.urls]
Homepage = "https://github.com/cinostroza/reverie"
Repository = "https://github.com/cinostroza/reverie"
Issues = "https://github.com/cinostroza/reverie/issues"

[tool.hatch.version]
path = "reverie/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["reverie"]

# The sdist is the package, not the research repo: experiments, paper and
# literature stay on GitHub.
[tool.hatch.build.targets.sdist]
include = ["/reverie", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
